<!DOCTYPE html>
<html>
    <head>
        <title>File-Manager</title>
        <link rel="stylesheet" href="/web/styles.css"/>
    </head>
    <body data-page="notes">
        <header>
            <h1 id="title">File-Manager</h1>
        </header>

        <nav>
            <div class="nav-item" data-page="media">
                <h3 id="media_title">Media</h3>
            </div>
            <div class="nav-item" data-page="database">
                <h3 id="db_title">Database</h3>
            </div>
            <div class="nav-item" data-page="notes">
                <h3 id="notes_title">Notes</h3>
            </div>
        </nav>

        <main>
            <section>
                <textarea id="content"></textarea>
                <div class="button-row">
                    <button id="load-notes" type="button">Laden</button>
                    <button id="save-notes" type="button">Speichern</button>
                    <a class="download-button" href="/notes_download" download>Notes als .txt herunterladen</a>
                    <a class="download-button" href="/download_data" download>Alle Daten downloaden</a>
                </div>
            </section>
        </main>
        <script src="/web/main.js"></script>
    </body>
</html>
